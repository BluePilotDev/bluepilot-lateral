# Moves the `release` branch to each published release's commit, so hosts that follow `release`
# (bg-opendbc's .gitmodules, and Dependabot there) get it. Fast-forward only: a release that isn't
# ahead of `release` fails here instead of rewriting the branch. A manual run takes the tag to move to.
name: release branch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to move `release` to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Fast-forward release to the tag
      env:
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        sha=$(git rev-parse "refs/tags/$TAG^{commit}")
        git merge-base --is-ancestor origin/release "$sha"
        git push origin "$sha:refs/heads/release"
        echo "release -> $TAG ($sha)"
